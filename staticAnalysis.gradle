apply plugin: 'com.github.spotbugs'

spotbugs {
    ignoreFailures = true
    showStackTraces = true
    showProgress = true
    //reportLevel = Confidence.DEFAULT
    //visitors = listOf("FindSqlInjection", "SwitchFallthrough")
    //omitVisitors = listOf("FindNonShortCircuit")
    //chooseVisitors = listOf("-FindNonShortCircuit", "+TestASM")
    reportsDir = file( "build/reports/" )
    excludeFilter = file( "$rootProject.projectDir/findbugs.xml" )
}


spotbugsMain {
    reports {
        xml.required = true
        html.required = true
        sarif.required = true
    }
}

spotbugsTest {
    enabled = false
}

sonar{
    properties{
        property "sonar.java.spotbugs.reportPaths","build/reports/main.xml"
    }
}





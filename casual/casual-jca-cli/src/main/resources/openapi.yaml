openapi: 3.0.4
info:
  title: casual-jca-cli
  description: Specification of CLI Rest endpoints for casual-jca-cli
  version: 0.0.1

servers:
  - url: https://localhost/__casual/caller/cli

paths:
  /configuration:
    get:
      summary: Returns a list of users.
      description: Optional extended description in CommonMark or HTML.
      responses:
        "200": # status code
          description: A JSON array of user names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JCAConfiguration"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  responses:
    ServerError:
      description: Error occured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
        - code
        - message
    JCAConfiguration:
      type: object
      properties:
        domain:
          $ref: "#/components/schemas/Domain"
    Domain:
      type: object
      properties:
        id:
          type: string
        name:
          type: string